<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello canvas</title>
    <style>html,body{margin:0;height:100%;background:#0a0a0a}canvas{display:block;width:100%;height:100%}</style>
  </head>
  <body>
    <canvas></canvas>
    <script>
      const c = document.querySelector("canvas"), ctx = c.getContext("2d");
      const resize = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; };
      addEventListener("resize", resize); resize();
      (function frame(t) {
        ctx.fillStyle = "rgba(10,10,10,0.15)"; ctx.fillRect(0, 0, c.width, c.height);
        for (let i = 0; i < 12; i++) {
          const a = t / 1000 + i * 0.52, r = Math.min(c.width, c.height) * 0.3;
          ctx.fillStyle = `hsl(${i * 30}, 80%, 60%)`;
          ctx.beginPath(); ctx.arc(c.width / 2 + Math.cos(a) * r, c.height / 2 + Math.sin(a * 1.3) * r, 8 * devicePixelRatio, 0, 7); ctx.fill();
        }
        requestAnimationFrame(frame);
      })(0);
    </script>
  </body>
</html>
