<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="inherit">
  <g fill="currentColor" fill-opacity=".6">
    <text x="60" y="40" font-size="16" letter-spacing="1.5">HOW A COMPONENT GETS INTO THE APP</text>
    <text x="60" y="68" font-size="18">The app ends up owning a copy of the code, not a dependency on a package</text>
  </g>
  <!-- the outcome: the app's own file -->
  <rect x="909" y="140" width="178" height="16" data-marker="#e2552f" style="fill:#e2552f" fill-opacity=".55"/>
  <!-- the command that copies it -->
  <rect x="758" y="100" width="184" height="20" data-marker="#8fd3b6" style="fill:#8fd3b6" fill-opacity=".6"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M248 143H327M316 137L327 143L316 149"/>
    <path d="M506 143H612M601 137L612 143L601 149"/>
    <path d="M800 143H897M886 137L897 143L886 149"/>
  </g>
  <g fill="currentColor">
    <text x="850" y="116" font-size="17" font-family="ui-monospace, monospace" text-anchor="middle">willow add button</text>
    <g font-size="22" font-weight="600">
      <text x="60" y="150">Component file</text>
      <text x="345" y="150">Build script</text>
      <text x="630" y="150">Registry JSON</text>
      <text x="915" y="150">App's own file</text>
    </g>
    <g font-size="17" fill-opacity=".6">
      <text x="60" y="182">in the design</text>
      <text x="60" y="204">system repo</text>
      <text x="345" y="182">works out what</text>
      <text x="345" y="204">it depends on</text>
      <text x="630" y="182">30 files, rebuilt</text>
      <text x="630" y="204">only on main</text>
      <text x="915" y="182">imports rewritten,</text>
      <text x="915" y="204">free to edit</text>
    </g>
    <g font-size="18" fill-opacity=".6">
      <text x="60" y="282">Upgrades don't flow back. A fix in the system reaches the app only when someone</text>
      <text x="60" y="308">pulls that component again, and local edits get in the way.</text>
    </g>
  </g>
</svg>
