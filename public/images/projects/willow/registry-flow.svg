<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="system-ui, sans-serif">
  <rect width="1200" height="520" fill="#f6f2e9"/>
  <text x="60" y="70" font-size="30" font-weight="600" fill="#171717">How a component gets into the app</text>
  <text x="60" y="106" font-size="20" fill="#6b6b6b">The app ends up owning a copy of the code, not a dependency on a package</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#171717"/></marker></defs>
  <g font-size="20" fill="#171717">
    <rect x="60" y="180" width="230" height="130" rx="10" fill="#fff" stroke="#171717" stroke-width="1.5"/>
    <text x="80" y="225" font-weight="600">Component file</text>
    <text x="80" y="258" font-size="17" fill="#6b6b6b">in the design</text>
    <text x="80" y="282" font-size="17" fill="#6b6b6b">system repo</text>
    <rect x="345" y="180" width="230" height="130" rx="10" fill="#fff" stroke="#171717" stroke-width="1.5"/>
    <text x="365" y="225" font-weight="600">Build script</text>
    <text x="365" y="258" font-size="17" fill="#6b6b6b">works out what</text>
    <text x="365" y="282" font-size="17" fill="#6b6b6b">it depends on</text>
    <rect x="630" y="180" width="230" height="130" rx="10" fill="#fff" stroke="#171717" stroke-width="1.5"/>
    <text x="650" y="225" font-weight="600">Registry JSON</text>
    <text x="650" y="258" font-size="17" fill="#6b6b6b">30 files, rebuilt</text>
    <text x="650" y="282" font-size="17" fill="#6b6b6b">only on main</text>
    <rect x="915" y="180" width="230" height="130" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="935" y="225" font-weight="600">App's own file</text>
    <text x="935" y="258" font-size="17" fill="#6b6b6b">imports rewritten,</text>
    <text x="935" y="282" font-size="17" fill="#6b6b6b">free to edit</text>
    <line x1="292" y1="245" x2="341" y2="245" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="577" y1="245" x2="626" y2="245" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="862" y1="245" x2="911" y2="245" stroke="#171717" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="875" y="360" font-size="19" font-family="ui-monospace, monospace" fill="#2563eb">willow add button</text>
    <text x="60" y="440" font-size="18" fill="#6b6b6b">Upgrades don't flow back. A fix in the system reaches the app only when someone</text>
    <text x="60" y="468" font-size="18" fill="#6b6b6b">pulls that component again, and local edits get in the way.</text>
  </g>
</svg>
