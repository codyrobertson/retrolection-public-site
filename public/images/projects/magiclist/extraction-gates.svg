<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="inherit">
  <g fill="currentColor">
    <text x="60" y="40" font-size="16" letter-spacing="1.5" fill-opacity=".6">HOW A FILING'S FIELDS GET EXTRACTED, NOVEMBER 20</text>
    <text x="60" y="68" font-size="18" fill-opacity=".6">Regex goes first. A model only sees the filing if regex fails one of three gates.</text>
  </g>
  <!-- the change that matters: the lower bars set later that day -->
  <rect x="682" y="188" width="78" height="176" data-marker="#e2552f" style="fill:#e2552f" fill-opacity=".45"/>
  <!-- highlighter behind the later routing -->
  <rect x="856" y="340" width="214" height="44" data-marker="#8fd3b6" style="fill:#8fd3b6" fill-opacity=".6"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M150 144H318M307 138L318 144L307 150"/>
    <path d="M800 144H846M835 138L846 144L835 150"/>
    <path d="M800 160C824 160 822 294 846 294M834 290L846 294L837 303"/>
    <path data-pen="9h" d="M340 166H780"/>
  </g>
  <g fill="currentColor">
    <text x="60" y="150" font-size="22" font-weight="600">Regex</text>
    <text x="60" y="176" font-size="16" fill-opacity=".6">on the OCR text</text>

    <text x="340" y="150" font-size="22" font-weight="600">Three gates</text>
    <text x="580" y="150" font-size="16" fill-opacity=".6">first change</text>
    <text x="690" y="150" font-size="16">later that day</text>
    <g font-size="18">
      <text x="340" y="212">Required fields present</text>
      <text x="340" y="290">Average confidence</text>
      <text x="340" y="350">Completeness</text>
    </g>
    <text x="340" y="236" font-size="16" fill-opacity=".6">recorder number, address, sale date</text>
    <g font-size="22" font-weight="600">
      <text x="590" y="214">yes</text><text x="700" y="214">yes</text>
      <text x="590" y="292">85%</text><text x="700" y="292">70%</text>
      <text x="590" y="352">80%</text><text x="700" y="352">60%</text>
    </g>
    <text x="340" y="400" font-size="16" fill-opacity=".6">Lower bars send fewer filings to a paid model.</text>

    <text x="860" y="150" font-size="20" font-weight="600">All gates pass</text>
    <text x="860" y="176" font-size="16" fill-opacity=".6">Keep the regex fields.</text>
    <text x="860" y="300" font-size="20" font-weight="600">Any gate fails</text>
    <text x="860" y="328" font-size="16" fill-opacity=".6">First change: Claude.</text>
    <text x="860" y="356" font-size="16">Later: free models first,</text>
    <text x="860" y="378" font-size="16">then Claude.</text>

    <text x="60" y="470" font-size="16" fill-opacity=".6">October 27 had already tried a model writing regex per field, then Claude on every filing, both on the same day.</text>
  </g>
</svg>
