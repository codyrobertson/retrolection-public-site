  <!-- highlighter under the tie label -->
  <rect x="540" y="202" width="120" height="22" data-marker="#8fd3b6" style="fill:#8fd3b6" fill-opacity=".6"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <!-- arrows between steps: shaft + open head -->
    <path d="M182 84H218M207 78L218 84L207 90"/>
    <path d="M342 84H378M367 78L378 84L367 90"/>
    <path d="M502 84H538M527 78L538 84L527 90"/>
    <path d="M662 84H698M687 78L698 84L687 90"/>
    <path d="M822 84H858M847 78L858 84L847 90"/>
    <path d="M982 84H1018M1007 78L1018 84L1007 90"/>
    <!-- one address: tie line under every step -->
    <path d="M120 180H1080" data-w="1.3"/>
    <g data-pen="9h">
      <path d="M120 134V140M120 146V152M120 158V164M120 170V178"/>
      <path d="M280 134V140M280 146V152M280 158V164M280 170V178"/>
      <path d="M440 134V140M440 146V152M440 158V164M440 170V178"/>
      <path d="M600 134V140M600 146V152M600 158V164M600 170V178"/>
      <path d="M760 134V140M760 146V152M760 158V164M760 170V178"/>
      <path d="M920 134V140M920 146V152M920 158V164M920 170V178"/>
      <path d="M1080 134V140M1080 146V152M1080 158V164M1080 170V178"/>
    </g>
  </g>
  <g fill="currentColor" text-anchor="middle">
    <g font-size="21" font-weight="600">
      <text x="120" y="90">Storm</text>
      <text x="280" y="90">Score</text>
      <text x="440" y="90">Pick homes</text>
      <text x="600" y="90">Postcard</text>
      <text x="760" y="90">Scan</text>
      <text x="920" y="90">Booking</text>
      <text x="1080" y="90">Signed job</text>
    </g>
    <g font-size="16" fill-opacity=".6">
      <text x="120" y="118">hail + wind</text>
      <text x="280" y="118">exposure + roof</text>
      <text x="440" y="118">contractor</text>
      <text x="600" y="118">its own QR</text>
      <text x="760" y="118">homeowner</text>
      <text x="920" y="118">inspection</text>
      <text x="1080" y="118">attributed</text>
    </g>
    <text x="600" y="219" font-size="19" font-weight="600">one address</text>
  </g>
  <text x="60" y="290" font-size="16" fill="currentColor" fill-opacity=".6">Two users: contractor staff in a dense dashboard (storm to postcard), homeowners on a phone (scan onward).</text>
</svg>
