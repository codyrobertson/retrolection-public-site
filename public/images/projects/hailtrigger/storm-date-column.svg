<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="inherit">
  <text x="60" y="40" font-size="17" fill="currentColor" fill-opacity=".6">The same block, two ways to fill the storm_date column. The hail polygon misses this block entirely.</text>
  <!-- the misleading column: orange-red margin strip -->
  <rect x="234" y="180" width="7" height="228" data-marker="#e2552f" style="fill:#e2552f"/>
  <!-- the fix: highlighter behind its header -->
  <rect x="634" y="98" width="370" height="20" data-marker="#8fd3b6" style="fill:#8fd3b6" fill-opacity=".6"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M60 162H520"/>
    <path d="M640 162H1140"/>
  </g>
  <g fill="currentColor">
    <g font-size="20" font-weight="600">
      <text x="60" y="114">Before: nearest hail report</text>
      <text x="640" y="114">After: inside the polygon or nothing</text>
    </g>
    <g font-size="17" fill-opacity=".6">
      <text x="60" y="150">Parcel</text><text x="250" y="150">storm_date</text>
      <text x="640" y="150">Parcel</text><text x="830" y="150">storm_date</text>
    </g>
    <g font-size="17">
      <text x="60" y="200">Parcel 101</text><text x="250" y="200">this week</text>
      <text x="60" y="240">Parcel 102</text><text x="250" y="240">this week</text>
      <text x="60" y="280">Parcel 103</text><text x="250" y="280">this week</text>
      <text x="60" y="320">Parcel 104</text><text x="250" y="320">this week</text>
      <text x="60" y="360">Parcel 105</text><text x="250" y="360">this week</text>
      <text x="60" y="400">Parcel 106</text><text x="250" y="400">this week</text>
      <text x="640" y="200">Parcel 101</text>
      <text x="640" y="240">Parcel 102</text>
      <text x="640" y="280">Parcel 103</text>
      <text x="640" y="320">Parcel 104</text>
      <text x="640" y="360">Parcel 105</text>
      <text x="640" y="400">Parcel 106</text>
    </g>
    <g font-size="17" fill-opacity=".6">
      <text x="830" y="200">none: outside polygon</text>
      <text x="830" y="240">none: outside polygon</text>
      <text x="830" y="280">none: outside polygon</text>
      <text x="830" y="320">none: outside polygon</text>
      <text x="830" y="360">none: outside polygon</text>
      <text x="830" y="400">none: outside polygon</text>
    </g>
    <g font-size="17" fill-opacity=".6">
      <text x="60" y="460">Operators read the left column as "this home got hit this week."</text>
      <text x="60" y="486">It only meant a hail report landed somewhere nearby.</text>
      <text x="640" y="460">Containment only. If the city's geometry is missing,</text>
      <text x="640" y="486">the coverage check fails closed instead of guessing.</text>
    </g>
  </g>
</svg>
