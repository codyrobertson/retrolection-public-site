<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="inherit">
  <g fill="currentColor">
    <text x="60" y="40" font-size="16" letter-spacing="1.5" fill-opacity=".6">HOW A CHAT QUESTION BECOMES AN APP BOARD</text>
    <text x="60" y="68" font-size="18" fill-opacity=".6">The server picks the store. The model never does, and it never writes the headline number.</text>
  </g>
  <!-- the key step: every query runs inside withEntity() -->
  <rect x="812" y="134" width="226" height="52" data-marker="#e2552f" style="fill:#e2552f" fill-opacity=".45"/>
  <!-- the outcome -->
  <rect x="54" y="354" width="196" height="22" data-marker="#8fd3b6" style="fill:#8fd3b6" fill-opacity=".6"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M330 143H418M407 137L418 143L407 149"/>
    <path d="M680 143H798M787 137L798 143L787 149"/>
    <path d="M960 256V328M954 317L960 328L966 317"/>
    <path d="M800 363H632M643 357L632 363L643 369"/>
    <path d="M420 363H270M281 357L270 363L281 369"/>
  </g>
  <g fill="currentColor">
    <g font-size="16" fill-opacity=".6" letter-spacing="1.5">
      <text x="60" y="112">1</text><text x="440" y="112">2</text><text x="820" y="112">3</text>
      <text x="820" y="336">4</text><text x="440" y="336">5</text><text x="60" y="336">6</text>
    </g>
    <g font-size="22" font-weight="600">
      <text x="60" y="150">Operator asks in chat</text>
      <text x="440" y="150">Server resolves</text>
      <text x="440" y="178">operator, org, store</text>
      <text x="820" y="150">Every query runs</text>
      <text x="820" y="178">inside withEntity()</text>
      <text x="820" y="370">Headline numbers</text>
      <text x="820" y="398">come from Cube</text>
      <text x="440" y="370">ViewSpec check</text>
      <text x="60" y="370">Saved App Board</text>
    </g>
    <g font-size="16" fill-opacity=".6">
      <text x="60" y="184">A question about one store's</text>
      <text x="60" y="206">data, typed in plain words.</text>
      <text x="440" y="212">The browser and the agent's</text>
      <text x="440" y="234">tools never pass a tenant id.</text>
      <text x="820" y="212">Postgres row-level security,</text>
      <text x="820" y="234">one warehouse schema per store.</text>
      <text x="820" y="432">Anything the model works out</text>
      <text x="820" y="454">itself is labeled unverified.</text>
      <text x="440" y="404">Generated UI must validate</text>
      <text x="440" y="426">against the schema before it</text>
      <text x="440" y="448">renders or saves.</text>
      <text x="60" y="404">A dashboard built from</text>
      <text x="60" y="426">governed metrics.</text>
    </g>
  </g>
</svg>
