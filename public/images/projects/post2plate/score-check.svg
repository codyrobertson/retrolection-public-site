<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="system-ui, sans-serif">
  <rect width="1200" height="600" fill="#f6f2e9"/>
  <text x="60" y="70" font-size="30" font-weight="600" fill="#171717">Reported score vs. a model that always guesses the common answer</text>
  <text x="60" y="108" font-size="20" fill="#6b6b6b">Three small models from the first scorecard, re-checked two days later</text>
  <!-- axis scale: 0 -> x=360, 1.0 -> x=1100 ; 740px per 1.0 -->
  <g font-size="20" fill="#171717">
    <!-- Temperature -->
    <text x="60" y="190" font-weight="600">Temperature</text>
    <text x="60" y="214" font-size="16" fill="#6b6b6b">answer leaked into input</text>
    <rect x="360" y="165" width="555.7" height="22" fill="#d97706"/>
    <text x="925" y="183" font-size="18">0.751 reported</text>
    <rect x="360" y="192" width="470.6" height="22" fill="#2563eb"/>
    <text x="840" y="210" font-size="18">0.636 after fix</text>
    <rect x="360" y="219" width="445.5" height="22" fill="#b9b3a6"/>
    <text x="815" y="237" font-size="18" fill="#6b6b6b">0.602 always-guess</text>
    <!-- Method-fix -->
    <text x="60" y="320" font-weight="600">Method-fix</text>
    <text x="60" y="344" font-size="16" fill="#6b6b6b">all 500 labels the same</text>
    <rect x="360" y="305" width="506.9" height="22" fill="#d97706"/>
    <text x="877" y="323" font-size="18">0.685 passed the gate</text>
    <rect x="360" y="332" width="506.9" height="22" fill="#b9b3a6"/>
    <text x="877" y="350" font-size="18" fill="#6b6b6b">0.685 always-guess</text>
    <!-- Ingredient matching -->
    <text x="60" y="450" font-weight="600">Ingredient matching</text>
    <text x="60" y="474" font-size="16" fill="#6b6b6b">held up</text>
    <rect x="360" y="435" width="733.3" height="22" fill="#2563eb"/>
    <text x="1093" y="430" font-size="18" text-anchor="end">0.991</text>
    <rect x="360" y="462" width="557.2" height="22" fill="#b9b3a6"/>
    <text x="927" y="480" font-size="18" fill="#6b6b6b">0.753 always-guess</text>
  </g>
  <line x1="360" y1="150" x2="360" y2="500" stroke="#171717" stroke-width="1.5"/>
  <text x="60" y="560" font-size="17" fill="#6b6b6b">Orange: a score that looked like signal and wasn't. Grey: the dumb-guess baseline every gate is now set against.</text>
</svg>
