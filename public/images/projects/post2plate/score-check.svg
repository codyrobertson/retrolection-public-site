<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="inherit">
  <g fill="currentColor" fill-opacity=".6">
    <text x="60" y="40" font-size="17">Reported score vs. a model that always guesses the common answer</text>
    <text x="60" y="66" font-size="16">Three small models from the first scorecard, re-checked two days later</text>
  </g>
  <!-- scale: 0 -> x=360, 1.0 -> x=1100 (740px per 1.0). Always-guess is a pencil line at its value. -->
  <!-- the story: scores that looked like signal and weren't -->
  <g data-marker="#e2552f" style="fill:#e2552f">
    <rect x="360" y="114" width="555.7" height="14"/>
    <rect x="360" y="236" width="506.9" height="14"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <g data-pen="3b">
      <rect x="360" y="140" width="470.6" height="14" data-hatch="45 5"/>
      <rect x="360" y="358" width="733.3" height="14" data-hatch="45 5"/>
    </g>
    <rect x="360" y="114" width="555.7" height="14"/>
    <rect x="360" y="140" width="470.6" height="14"/>
    <rect x="360" y="236" width="506.9" height="14"/>
    <rect x="360" y="358" width="733.3" height="14"/>
    <!-- range-frame zero line -->
    <path d="M360 104V382"/>
    <g data-pen="9h" data-w="1.2">
      <path d="M805.5 102V168"/>
      <path d="M866.9 224V262"/>
      <path d="M917.2 346V384"/>
    </g>
  </g>
  <g fill="currentColor">
    <g font-size="20" font-weight="600">
      <text x="60" y="128">Temperature</text>
      <text x="60" y="250">Method-fix</text>
      <text x="60" y="372">Ingredient matching</text>
    </g>
    <g font-size="16" fill-opacity=".6">
      <text x="60" y="152">answer leaked into input</text>
      <text x="60" y="274">all 500 labels the same</text>
      <text x="60" y="396">held up</text>
    </g>
    <g font-size="18">
      <text x="926" y="127">0.751 reported</text>
      <text x="841" y="153">0.636 after fix</text>
      <text x="877" y="249">0.685 passed the gate</text>
      <text x="1103" y="371">0.991</text>
    </g>
    <g font-size="16" fill-opacity=".6">
      <text x="805.5" y="188" text-anchor="middle">0.602 always-guess</text>
      <text x="877" y="276">0.685 always-guess</text>
      <text x="927" y="400">0.753 always-guess</text>
    </g>
  </g>
</svg>
