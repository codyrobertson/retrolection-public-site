<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="inherit" role="img" aria-labelledby="t d">
  <title id="t">Results that looked like wins, and what checking them showed</title>
  <desc id="d">A ledger. Three apparent wins: 0.9933 on the sealed set with leaked real photos, which held at 0.9933 after a clean retrain; 0.9867 on the local test, which fell to 36.3% and 4.0% AI caught on public benchmarks, then rose to 88.0% and 60.8% with public training data; a claimed lift from 0.809 to 0.981, whose real gain was 0.002 and was retracted. Below, four experiments that lost.</desc>
  <text x="60" y="40" font-size="17" fill="currentColor" fill-opacity=".6">Balanced accuracy unless marked. "AI caught" is the share of AI images flagged.</text>
  <!-- margin marks on the outcome column: slate blue = held up, orange-red = failed the check or lost -->
  <g data-marker="#5b7189" style="fill:#5b7189">
    <rect x="774" y="128" width="6" height="24"/>
    <rect x="774" y="216" width="6" height="24"/>
  </g>
  <g data-marker="#e2552f" style="fill:#e2552f">
    <rect x="774" y="188" width="6" height="24"/>
    <rect x="774" y="278" width="6" height="24"/>
    <rect x="774" y="386" width="6" height="24"/>
    <rect x="774" y="438" width="6" height="24"/>
    <rect x="774" y="490" width="6" height="24"/>
    <rect x="774" y="542" width="6" height="24"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M60 108H1140"/>
    <path d="M60 368H1140"/>
    <g data-pen="9h">
      <path d="M60 172H1140"/>
      <path d="M60 262H1140"/>
      <path d="M60 426H1140"/>
      <path d="M60 478H1140"/>
      <path d="M60 530H1140"/>
    </g>
  </g>
  <g fill="currentColor">
    <g font-size="16" letter-spacing="1.5" fill-opacity=".6">
      <text x="60" y="96">LOOKED LIKE</text>
      <text x="420" y="96">CHECK</text>
      <text x="790" y="96">AFTER THE CHECK</text>
      <text x="60" y="356">EXPERIMENTS THAT LOST</text>
    </g>
    <g font-size="18">
      <text x="60" y="146" font-weight="600">0.9933 on the sealed 300</text>
      <text x="420" y="146">Real photos shared a split with training</text>
      <text x="790" y="146" font-weight="600">Retrained clean: 0.9933 held</text>

      <text x="60" y="206" font-weight="600">0.9867 on the local test</text>
      <text x="420" y="206">Public benchmarks, AI caught</text>
      <text x="790" y="206" font-weight="600">DALL-E 36.3%, CF eval 4.0%</text>
      <text x="790" y="234">With public training data: 88.0%, 60.8%</text>

      <text x="60" y="296" font-weight="600">0.809 to 0.981 on hard reals</text>
      <text x="420" y="296">Re-measured across data batches</text>
      <text x="790" y="296" font-weight="600">Real gain 0.002. Retracted</text>

      <text x="60" y="404">5,000 casual photos added as reals</text>
      <text x="790" y="404">GAN detection 92% to 15%</text>
      <text x="60" y="456">DINOv3, frozen and fully fine-tuned</text>
      <text x="790" y="456">0.9333 frozen, 0.9600 fine-tuned</text>
      <text x="60" y="508">Simulated screenshots</text>
      <text x="790" y="508">Screenshot detection got worse</text>
      <text x="60" y="560">MobileNetV3 at 8-bit</text>
      <text x="790" y="560">Called real photos 92% AI</text>
    </g>
  </g>
</svg>
