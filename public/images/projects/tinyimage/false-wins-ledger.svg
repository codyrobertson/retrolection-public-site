<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Results that looked like wins, and what checking them showed</title>
  <desc id="d">A ledger. Three apparent wins: 0.9933 on the sealed set with leaked real photos, which held at 0.9933 after a clean retrain; 0.9867 on the local test, which fell to 36.3% and 4.0% AI caught on public benchmarks, then rose to 88.0% and 60.8% with public training data; a claimed lift from 0.809 to 0.981, whose real gain was 0.002 and was retracted. Below, four experiments that lost.</desc>
  <rect width="1200" height="720" fill="#f6f2e9"/>
  <text x="60" y="66" font-size="30" font-weight="600" fill="#171717">Results that looked like wins, and what checking showed</text>
  <text x="60" y="98" font-size="18" fill="#6b6b6b">Balanced accuracy unless marked. "AI caught" is the share of AI images flagged.</text>

  <g font-size="15" font-weight="600" letter-spacing="1" fill="#6b6b6b">
    <text x="60" y="148">LOOKED LIKE</text>
    <text x="420" y="148">CHECK</text>
    <text x="800" y="148">AFTER THE CHECK</text>
  </g>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#171717" stroke-width="1.5"/>

  <g font-size="19" fill="#171717">
    <text x="60" y="200" font-weight="600">0.9933 on the sealed 300</text>
    <text x="420" y="200">Real photos shared a split with training</text>
    <text x="800" y="200" fill="#2563eb" font-weight="600">Retrained clean: 0.9933 held</text>
    <line x1="60" y1="226" x2="1140" y2="226" stroke="#6b6b6b" stroke-width="0.5"/>

    <text x="60" y="266" font-weight="600">0.9867 on the local test</text>
    <text x="420" y="266">Public benchmarks, AI caught</text>
    <text x="800" y="266" fill="#d97706" font-weight="600">DALL-E 36.3%, CF eval 4.0%</text>
    <text x="800" y="294" fill="#2563eb">With public training data: 88.0%, 60.8%</text>
    <line x1="60" y1="320" x2="1140" y2="320" stroke="#6b6b6b" stroke-width="0.5"/>

    <text x="60" y="360" font-weight="600">0.809 to 0.981 on hard reals</text>
    <text x="420" y="360">Re-measured across data batches</text>
    <text x="800" y="360" fill="#d97706" font-weight="600">Real gain 0.002. Retracted</text>
  </g>

  <text x="60" y="440" font-size="15" font-weight="600" letter-spacing="1" fill="#6b6b6b">EXPERIMENTS THAT LOST</text>
  <line x1="60" y1="452" x2="1140" y2="452" stroke="#171717" stroke-width="1.5"/>
  <g font-size="19" fill="#171717">
    <text x="60" y="492">5,000 casual photos added as reals</text>
    <text x="800" y="492" fill="#d97706">GAN detection 92% to 15%</text>
    <line x1="60" y1="516" x2="1140" y2="516" stroke="#6b6b6b" stroke-width="0.5"/>
    <text x="60" y="552">DINOv3, frozen and fully fine-tuned</text>
    <text x="800" y="552" fill="#d97706">0.9333 frozen, 0.9600 fine-tuned</text>
    <line x1="60" y1="576" x2="1140" y2="576" stroke="#6b6b6b" stroke-width="0.5"/>
    <text x="60" y="612">Simulated screenshots</text>
    <text x="800" y="612" fill="#d97706">Screenshot detection got worse</text>
    <line x1="60" y1="636" x2="1140" y2="636" stroke="#6b6b6b" stroke-width="0.5"/>
    <text x="60" y="672">MobileNetV3 at 8-bit</text>
    <text x="800" y="672" fill="#d97706">Called real photos 92% AI</text>
  </g>
</svg>
