<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="inherit" role="img" aria-labelledby="t d">
  <title id="t">Test AUC by approach</title>
  <desc id="d">Horizontal bars in two groups. First experiments on one dataset: Qwen3-8B LoRA fine-tune 0.484, GRPO on top 0.488, popularity table 0.815. Later experiments: XGBoost with LLM features at full coverage 0.485, two-tower scorer about 0.79. A dashed line marks 0.5, a coin flip.</desc>
  <text x="60" y="40" font-size="17" fill="currentColor" fill-opacity=".6">How well each approach ranked buyers (test AUC). 0.5 is a coin flip, 1.0 is perfect.</text>
  <!-- scale: x = 400 + auc * 720, same scale for both groups -->
  <!-- the story: the LLM-driven runs that landed under the coin flip -->
  <g data-marker="#e2552f" style="fill:#e2552f">
    <rect x="400" y="127" width="348.5" height="14"/>
    <rect x="400" y="169" width="351.4" height="14"/>
    <rect x="400" y="311" width="349.2" height="14"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <g data-pen="3b">
      <rect x="400" y="211" width="586.8" height="14" data-hatch="45 5"/>
      <rect x="400" y="353" width="568.8" height="14" data-hatch="45 5"/>
    </g>
    <rect x="400" y="127" width="348.5" height="14"/>
    <rect x="400" y="169" width="351.4" height="14"/>
    <rect x="400" y="211" width="586.8" height="14"/>
    <rect x="400" y="311" width="349.2" height="14"/>
    <rect x="400" y="353" width="568.8" height="14"/>
    <!-- range-frame zero line, spans the bars only -->
    <path d="M400 118V376"/>
    <!-- coin flip at 0.5, pencil dashes -->
    <path data-pen="9h" d="M760 112V124M760 132V144M760 152V164M760 172V184M760 192V204M760 212V224M760 232V244M760 252V264M760 272V284M760 292V304M760 312V324M760 332V344M760 352V364M760 372V380"/>
  </g>
  <g fill="currentColor">
    <g font-size="16" letter-spacing="1.5" fill-opacity=".6">
      <text x="60" y="100">FIRST EXPERIMENTS, SAME DATASET</text>
      <text x="60" y="284">LATER EXPERIMENTS</text>
    </g>
    <g font-size="18" text-anchor="end">
      <text x="380" y="140">LLM fine-tune (Qwen3-8B LoRA)</text>
      <text x="380" y="182">GRPO on top of the fine-tune</text>
      <text x="380" y="224">Popularity table</text>
      <text x="380" y="324">XGBoost + LLM features, full coverage</text>
      <text x="380" y="366">Two-tower scorer (shipped)</text>
    </g>
    <g font-size="18" font-weight="600">
      <text x="772" y="140">0.484</text>
      <text x="772" y="182">0.488</text>
      <text x="999" y="224">0.815</text>
      <text x="772" y="324">0.485</text>
      <text x="981" y="366">~0.79</text>
    </g>
    <g font-size="16" fill-opacity=".6" text-anchor="middle">
      <text x="760" y="404">coin flip (0.5)</text>
      <text x="400" y="404">0</text>
    </g>
  </g>
</svg>
