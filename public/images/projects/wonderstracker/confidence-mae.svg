<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" font-family="inherit" role="img" aria-labelledby="t d">
  <title id="t">Order-book error by confidence bucket, after the fix</title>
  <desc id="d">Two bars. Low-confidence predictions: mean absolute error $108.88 across 28 predictions. Medium-confidence: $40.28 across 223 predictions. No predictions landed in the high bucket. Before the fix, the order was reversed.</desc>
  <g fill="currentColor" fill-opacity=".6">
    <text x="60" y="40" font-size="17">Floor price error: mean absolute error against the next actual sale.</text>
    <text x="60" y="66" font-size="16">Before the fix, higher confidence meant higher error.</text>
  </g>
  <!-- scale: x = 300 + mae * 6 -->
  <rect x="300" y="200" width="242" height="22" data-marker="#e2552f" style="fill:#e2552f"/>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="300" y="120" width="653" height="22" data-pen="3b" data-hatch="45 6"/>
    <rect x="300" y="120" width="653" height="22"/>
    <rect x="300" y="200" width="242" height="22"/>
    <!-- range-frame axis: spans the two bars -->
    <path d="M300 110V232"/>
  </g>
  <g fill="currentColor">
    <g font-size="20" text-anchor="end">
      <text x="280" y="134">Low confidence</text>
      <text x="280" y="214">Medium confidence</text>
      <text x="280" y="294">High confidence</text>
    </g>
    <g font-size="16" text-anchor="end" fill-opacity=".6">
      <text x="280" y="158">28 predictions</text>
      <text x="280" y="238">223 predictions</text>
    </g>
    <g font-size="20" font-weight="600">
      <text x="968" y="138">$108.88</text>
      <text x="557" y="218">$40.28</text>
    </g>
    <text x="318" y="294" font-size="18" fill-opacity=".6">No predictions landed here</text>
    <text x="60" y="346" font-size="16" fill-opacity=".6">Small sample, and no high bucket to compare against.</text>
  </g>
</svg>
