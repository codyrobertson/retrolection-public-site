headline: Design Engineer & Creative Director
summary: >-
  Self-taught designer who grew up in startups. Creative director behind a
  string of Web3 industry firsts, now building AI-native products end to end:
  brand, interface, and code. I see the whole system (the creative concept,
  the economic model, the technical execution) and connect the dots.
location: Phoenix, AZ
